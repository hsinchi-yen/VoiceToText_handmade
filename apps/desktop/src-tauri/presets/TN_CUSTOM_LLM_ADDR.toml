# Built-in LAN preset (TN). Applied from the app's "preset" dialog (T4.1).
# Only [preset], [[cloud]] and [route] are read; everything else is ignored.

[preset]
title = "TN 區網服務"
# Every service id below must start with this prefix.
id_prefix = "tn-"
# Speech recognition endpoints the user can choose between.
asr_choices = ["tn-tea-asr", "tn-breeze-asr"]
# Endpoints that need an API key (asked in the dialog, stored in the OS keyring).
needs_key = ["tn-tea-asr", "tn-breeze-asr"]
# Default keys, stored when the user does not type one. This is the LAN server's shared key
# (TEA and Breeze both require it; found by the Android emulator test 2026-11-13),
# deliberately committed to git per the project owner's decision (2026-11-12).
default_keys = { "tn-tea-asr" = "tn8227", "tn-breeze-asr" = "tn8227" }
# Old apply-time detection; ignored by the desktop (2026-11-13). Model ids below use "auto"
# instead, which is resolved at run time from the server's /models.
detect_llm_model = true

[route]
# asr is set from the user's choice; polish and translate go to the LLM.
polish = "tn-qwen"
translate = "tn-qwen"
cloud_fallback_to_local = true

[[cloud]]
id = "tn-tea-asr"
name = "TN TEA-ASR"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8001/v1"
asr_model = "auto"

[[cloud]]
id = "tn-breeze-asr"
name = "TN Breeze-ASR"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8002/v1"
asr_model = "auto"
# Breeze is slower than the global default.
asr_timeout_ms = 8000

[[cloud]]
id = "tn-qwen"
name = "TN Qwen3.8 27B"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8000/v1"
# "auto": v2c asks the server's /models on first use, so a server-side rename needs no config change.
llm_model = "auto"
