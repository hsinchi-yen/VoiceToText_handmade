[package]
name = "v2c-desktop"
description = "v2c desktop app (Tauri v2): hotkey -> recorder -> pipeline -> text injection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "v2c"
path = "src/main.rs"

[features]
# Build Breeze (whisper.cpp) with CUDA. Off by default so `cargo test --workspace` works without
# the CUDA Toolkit. Release builds enable it: `npm run tauri:build:cuda` (see package.json).
cuda = ["v2c-asr-local/cuda"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
v2c-core.workspace = true
v2c-asr-local.workspace = true
v2c-platform.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
cpal = "0.18"
rubato = "5"

[dev-dependencies]
async-trait.workspace = true
hound.workspace = true
serde_json = "1"
