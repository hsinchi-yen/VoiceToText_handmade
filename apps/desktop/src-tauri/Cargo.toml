[package]
name = "v2c-desktop"
description = "v2c desktop app (Tauri v2): hotkey -> recorder -> pipeline -> text injection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "v2c"
path = "src/main.rs"

[features]
# Build Breeze (whisper.cpp) with CUDA. Off by default so `cargo test --workspace` works without
# the CUDA Toolkit. Release builds enable it: `npm run tauri:build:cuda` (see package.json).
cuda = ["v2c-asr-local/cuda"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
v2c-core = { workspace = true, features = ["keyring"] }
v2c-asr-local.workspace = true
v2c-platform.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
cpal = "0.18"
rubato = "5"
# Cloud wizard (T1.7b): keyring default store, comment-preserving config edits, key hygiene.
keyring-core.workspace = true
toml_edit.workspace = true
zeroize.workspace = true

# Overlay window styles (no activation, click-through); see src/overlay.rs.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(windows)'.dependencies.windows-native-keyring-store]
workspace = true

[dev-dependencies]
wiremock.workspace = true
async-trait.workspace = true
hound.workspace = true
serde_json = "1"
