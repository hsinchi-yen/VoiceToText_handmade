[package]
name = "v2c-platform"
description = "All OS-specific code for v2c: hotkey hooks, text injection, foreground app, data protection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
v2c-core.workspace = true
thiserror.workspace = true

# Shared by T0.2 (hook), T0.3 (SendInput, foreground), T1.2 (clipboard), T1.9 (DPAPI).
# Added up front so parallel tasks don't both edit this file.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# T3.3: Linux LLM/ASR integration and end-to-end simulation tests (tests/linux_*.rs).
[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
wiremock.workspace = true
