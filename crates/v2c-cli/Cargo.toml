[package]
name = "v2c-cli"
description = "v2c developer tool: transcribe, bench, hotkey-test, inject-test"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "v2c-cli"
path = "src/main.rs"

[features]
# Build Breeze (whisper.cpp) with CUDA: `cargo run -p v2c-cli --release --features cuda -- bench ...`
cuda = ["v2c-asr-local/cuda"]
# SenseVoice-Small on CPU via sherpa-onnx (downloads prebuilt sherpa-onnx libs at build time):
# `cargo run -p v2c-cli --release --features sensevoice -- bench --asr sensevoice --model <dir> ...`
sensevoice = ["v2c-asr-local/sensevoice"]

[dependencies]
v2c-core.workspace = true
v2c-asr-local.workspace = true
v2c-platform.workspace = true
anyhow.workspace = true
clap.workspace = true
hound.workspace = true
# `bench --llm lmstudio`: async runtime and the shared HTTP client for `OpenAiCompatLlm`.
reqwest.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
wiremock.workspace = true
