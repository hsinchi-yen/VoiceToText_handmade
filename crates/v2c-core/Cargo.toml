[package]
name = "v2c-core"
description = "Pure logic and provider interfaces for v2c (no OS-specific dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# Polish timeout (`tokio::time::timeout`); also listed in tasks/plan.md section 2.
tokio.workspace = true
tracing.workspace = true
# Encrypted input history (history.rs, T1.9).
rusqlite.workspace = true
# Pure-Rust OpenCC (Simplified -> Taiwan Traditional with Taiwan phrasing); see postprocess/zh_tw.rs.
ferrous-opencc = { version = "0.4", default-features = false, features = ["s2t-conversion", "t2s-conversion"] }
# Cloud providers (T1.7). rustls instead of OpenSSL so the crate also builds for Android.
reqwest.workspace = true
serde_json.workspace = true
base64.workspace = true
# OS-agnostic credential API; the binary picks and installs the platform store (see secrets.rs).
keyring-core = { workspace = true, optional = true }

[features]
# `KeyringSecretStore`, backed by whatever `keyring_core` default store the app installed.
keyring = ["dep:keyring-core"]

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
# In-memory `sample` store for the `keyring` feature tests.
keyring-core = { workspace = true, features = ["sample"] }
