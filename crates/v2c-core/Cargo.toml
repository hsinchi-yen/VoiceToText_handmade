[package]
name = "v2c-core"
description = "Pure logic and provider interfaces for v2c (no OS-specific dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# Polish timeout (`tokio::time::timeout`); also listed in tasks/plan.md section 2.
tokio.workspace = true
tracing.workspace = true
# Pure-Rust OpenCC (Simplified -> Taiwan Traditional with Taiwan phrasing); see postprocess/zh_tw.rs.
ferrous-opencc = { version = "0.4", default-features = false, features = ["s2t-conversion", "t2s-conversion"] }
# OpenAI-compatible LLM (LM Studio) and cloud providers; rustls only, see the root Cargo.toml.
reqwest.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
