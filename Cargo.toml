[workspace]
resolver = "2"
members = [
    "crates/v2c-core",
    "crates/v2c-asr-local",
    "crates/v2c-platform",
    "crates/v2c-cli",
    "crates/v2c-ffi",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
v2c-core = { path = "crates/v2c-core" }
v2c-asr-local = { path = "crates/v2c-asr-local" }
v2c-platform = { path = "crates/v2c-platform" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
nvml-wrapper = "0.13"
# 0.12 with `rustls-tls` = rustls + ring + webpki roots: no OpenSSL and no aws-lc build, so it
# also compiles for Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
base64 = "0.22"
keyring-core = "1"
wiremock = "0.6"
