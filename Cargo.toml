[workspace]
resolver = "2"
members = [
    "crates/v2c-core",
    "crates/v2c-asr-local",
    "crates/v2c-platform",
    "crates/v2c-cli",
    "crates/v2c-ffi",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
v2c-core = { path = "crates/v2c-core" }
v2c-asr-local = { path = "crates/v2c-asr-local" }
v2c-platform = { path = "crates/v2c-platform" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
nvml-wrapper = "0.13"
# SQLite for the encrypted history (T1.9); `bundled` compiles SQLite in (desktop and Android).
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
