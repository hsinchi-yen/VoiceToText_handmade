# v2c config file: TN LAN services (10.20.30.23).
# Import it from Settings > "匯入設定" (Windows / Linux). Same content as the built-in TN preset.
# Android only accepts HTTPS, so these HTTP LAN endpoints are skipped there (the phone has them built in).
# Full reference: docs/config-file.md
[v2c]
format = 1
exported_from = "manual"

[preset]
title = "TN 區網服務"
id_prefix = "tn-"
# Import asks which of these to use for speech recognition.
asr_choices = ["tn-tea-asr", "tn-breeze-asr"]
needs_key = ["tn-tea-asr", "tn-breeze-asr"]
# Shared key of the company LAN server (not a personal key), committed per the project owner's decision.
default_keys = { "tn-tea-asr" = "tn8227", "tn-breeze-asr" = "tn8227" }
# Ask the LLM endpoint for its model list; use it when it names exactly one model.
detect_llm_model = true

[route]
polish = "tn-qwen"
translate = "tn-qwen"
cloud_fallback_to_local = true

[[cloud]]
id = "tn-tea-asr"
name = "TN TEA-ASR"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8001/v1"
asr_model = "tea-asr-1"

[[cloud]]
id = "tn-breeze-asr"
name = "TN Breeze-ASR"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8002/v1"
asr_model = "breeze-asr-25"
asr_timeout_ms = 8000

[[cloud]]
id = "tn-qwen"
name = "TN Qwen3.8 27B"
kind = "open_ai_compat"
base_url = "http://10.20.30.23:8000/v1"
llm_model = "Qwen3.8-27B-UD-Q6_K_L"
