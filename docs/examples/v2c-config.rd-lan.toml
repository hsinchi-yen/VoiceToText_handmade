# v2c config file: RD LAN services (10.88.95.2).
# Import it from Settings > "匯入設定" (Windows / Linux). Same content as the built-in RD preset.
# Android only accepts HTTPS, so these HTTP LAN endpoints are skipped there (the phone has them built in).
# Full reference: docs/config-file.md
[v2c]
format = 1
exported_from = "manual"

[preset]
title = "RD 區網服務"
id_prefix = "rd-"
# Import asks which of these to use for speech recognition.
asr_choices = ["rd-tea-asr", "rd-breeze-asr"]
needs_key = ["rd-tea-asr", "rd-breeze-asr"]
# Shared key of the company LAN server (not a personal key), committed per the project owner's decision.
default_keys = { "rd-tea-asr" = "tn8227", "rd-breeze-asr" = "tn8227" }
# Kept for format compatibility; the desktop ignores it and uses llm_model as written (no network on apply).
detect_llm_model = true

[route]
polish = "rd-qwen"
translate = "rd-qwen"
cloud_fallback_to_local = true

[[cloud]]
id = "rd-tea-asr"
name = "RD TEA-ASR"
kind = "open_ai_compat"
base_url = "http://10.88.95.2:8001/v1"
asr_model = "tea-asr-1"

[[cloud]]
id = "rd-breeze-asr"
name = "RD Breeze-ASR"
kind = "open_ai_compat"
base_url = "http://10.88.95.2:8002/v1"
asr_model = "breeze-asr-25"
asr_timeout_ms = 8000

[[cloud]]
id = "rd-qwen"
name = "RD Qwen3.8 27B"
kind = "open_ai_compat"
base_url = "http://10.88.95.2:8000/v1"
llm_model = "Qwen3.8-27B-UD-Q6_K_L"
